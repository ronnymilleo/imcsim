name: Release

# A version tag, such as v0.6.0, builds the AppImage and publishes it with a GitHub release of that tag
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    # The oldest base the AppImage supports, the same one packaging/appimage/build.sh is tested in
    container: ubuntu:24.04
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the AppImage
        run: packaging/appimage/build.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/appimage/*.AppImage
          generate_release_notes: true
