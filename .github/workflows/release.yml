name: Release

# A version tag, such as v0.6.0, builds the AppImage and publishes it with a GitHub release of that tag; a tag with
# a suffix, such as v0.6.0-rc1, publishes a pre-release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    # The oldest base the AppImage supports, the same one packaging/appimage/build.sh is tested in
    container: ubuntu:24.04
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # CMake, SDL and ngspice take most of the build and only change with their versions in deps.env
      - name: Restore the built dependencies
        uses: actions/cache@v6
        with:
          path: /opt/deps
          key: appimage-deps-${{ hashFiles('packaging/appimage/deps.env') }}

      - name: Build the AppImage
        run: packaging/appimage/build.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: out/appimage/*.AppImage
          generate_release_notes: true
          # A tag with a suffix, such as v0.5.0-rc1, is a test build and never becomes the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
