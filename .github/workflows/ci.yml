name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ubuntu runners lack SDL3 and CMake 4.3, so every job runs in the same distribution the project is developed on
env:
  PACKAGES: >-
    git cmake ninja gcc clang pkgconf sdl3 vulkan-headers vulkan-icd-loader ngspice

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed $PACKAGES

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      # The build runs clang-format on every source, so any change means unformatted code was committed.
      # Only C++ files are compared, so other local edits (act copies the working tree) do not count
      - name: Check formatting
        run: git diff --exit-code -- '*.cpp' '*.h'

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check naming
        run: clang-tidy -p build --warnings-as-errors='*' $(git ls-files '*.cpp')

  sanitizers:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed $PACKAGES

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
