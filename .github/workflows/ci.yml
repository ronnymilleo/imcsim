name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Linux jobs run in an archlinux container, the distribution the project is developed on: Ubuntu runners
# lack CMake 4.3. SDL3 comes from its vendor submodule, but the sdl3 package carries the build dependencies of SDL
# (X11, Wayland, libxkbcommon); the tests never open a GPU
env:
  PACKAGES: >-
    git cmake ninja gcc clang python pkgconf sdl3 ngspice ccache
  # Compiled objects are kept between runs, so a push only recompiles what changed
  CCACHE_MAXSIZE: 500M
  COMPILER_LAUNCHER: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed $PACKAGES

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # In a container, only $GITHUB_WORKSPACE holds the path as the container sees it
      - name: Locate the compiler cache
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      # Each run saves a new cache and restores the newest one of its job, whatever the branch
      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-debug-${{ github.sha }}
          restore-keys: ccache-debug-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON $COMPILER_LAUNCHER

      - name: Build
        run: cmake --build build

      # The build runs clang-format on every source, so any change means unformatted code was committed.
      # Only C++ files are compared, so other local edits (act copies the working tree) do not count
      - name: Check formatting
        run: git diff --exit-code -- '*.cpp' '*.h'

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # One clang-tidy per core, on the sources of the project only (the vendor libraries are in the database too)
      - name: Check naming
        run: >-
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*'
          '/(app-core|app-gui|tests)/|/main\.cpp$'

      - name: Compiler cache statistics
        run: ccache --show-stats

  sanitizers:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed $PACKAGES

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Locate the compiler cache
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON $COMPILER_LAUNCHER
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows:
    # windows-latest is the Windows Server 2025 image with Visual Studio 2026, and comes with CMake 4.4 and
    # Ninja; SDL3 comes from its vendor submodule and ngspice from vendor/ngspice-windows, and the build copies the
    # DLLs next to the binaries
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Ninja looks for cl in the environment, which vcvarsall sets up
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
